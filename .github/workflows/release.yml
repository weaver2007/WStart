name: Release HotKeyManager

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

env:
  QT_VERSION: 6.8.3
  QT_ARCH: win64_msvc2022_64
  BUILD_DIR: out/build/github-qt6.8.3-msvc2022-dynamic-x64
  ARTIFACT_NAME: WStart-qt6.8.3-msvc2022-dynamic-x64
  UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/update.json

jobs:
  release-main-variant:
    name: Build and publish Qt 6.8.3 / MSVC 2022 / dynamic / x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "tag=${{ inputs.tag }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "tag=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt windows desktop "$env:QT_VERSION" "$env:QT_ARCH" --outputdir "$env:RUNNER_TEMP\Qt"
          "QT_PREFIX=$env:RUNNER_TEMP\Qt\$env:QT_VERSION\msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$env:RUNNER_TEMP\Qt\$env:QT_VERSION\msvc2022_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B "$env:BUILD_DIR"
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="$env:QT_PREFIX"
          -DHKM_QT_MAJOR=6
          -DHKM_DEPLOY_QT_RUNTIME=ON
          -DHKM_UPDATE_MANIFEST_URL="$env:UPDATE_MANIFEST_URL"

      - name: Build
        shell: pwsh
        run: cmake --build "$env:BUILD_DIR" --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir "$env:BUILD_DIR" -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP $env:ARTIFACT_NAME
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item -Path (Join-Path $env:BUILD_DIR "Release\*") -Destination $packageRoot -Recurse -Force
          Compress-Archive -Path (Join-Path $packageRoot "*") -DestinationPath "$env:ARTIFACT_NAME.zip" -Force

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: WStart ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
          files: ${{ env.ARTIFACT_NAME }}.zip
