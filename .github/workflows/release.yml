name: Release WStart

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.3.4"
        required: true
        type: string

permissions:
  contents: write

env:
  QT_VERSION: 6.8.3
  UPDATE_MANIFEST_URL: https://api.github.com/repos/${{ github.repository }}/releases/latest

jobs:
  build-packages:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows / Qt 6.8.3 / MSVC / x64
            platform: windows
            arch: x64
            os: windows-2022
            qt-host: windows
            qt-arch: win64_msvc2022_64
            cmake-generator: Visual Studio 17 2022
            cmake-arch: x64
            build-dir: out/build/release-windows-qt6.8.3-msvc2022-dynamic-x64
          - name: Windows / Qt 6.8.3 / MSVC / arm64
            platform: windows
            arch: arm64
            os: windows-11-arm
            qt-host: windows
            qt-arch: win64_msvc2022_arm64_cross_compiled
            qt-host-arch: win64_msvc2022_64
            cmake-generator: Visual Studio 17 2022
            cmake-arch: ARM64
            build-dir: out/build/release-windows-qt6.8.3-msvc2022-dynamic-arm64
          - name: macOS / Qt 6.8.3 / clang / x64
            platform: macos
            arch: x64
            os: macos-15-intel
            qt-host: mac
            qt-arch: clang_64
            build-dir: out/build/release-macos-qt6.8.3-clang-x64
          - name: macOS / Qt 6.8.3 / clang / arm64
            platform: macos
            arch: arm64
            os: macos-15
            qt-host: mac
            qt-arch: clang_64
            build-dir: out/build/release-macos-qt6.8.3-clang-arm64
          - name: Linux / Qt 6.8.3 / gcc / x64
            platform: linux
            arch: x64
            deb-arch: amd64
            os: ubuntu-24.04
            qt-host: linux
            qt-arch: linux_gcc_64
            build-dir: out/build/release-linux-qt6.8.3-gcc-x64
          - name: Linux / Qt 6.8.3 / gcc / arm64
            platform: linux
            arch: arm64
            deb-arch: arm64
            os: ubuntu-24.04-arm
            qt-host: linux_arm64
            qt-arch: linux_gcc_arm64
            build-dir: out/build/release-linux-qt6.8.3-gcc-arm64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve release version
        shell: pwsh
        run: |
          $refName = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $version = $refName
          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }
          "RELEASE_TAG=$refName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 fakeroot

      - name: Install macOS system packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt "${{ matrix.qt-host }}" desktop "$env:QT_VERSION" "${{ matrix.qt-arch }}" --outputdir "$env:RUNNER_TEMP/Qt"
          $hostArch = "${{ matrix.qt-host-arch }}"
          if ($hostArch) {
            python -m aqt install-qt "${{ matrix.qt-host }}" desktop "$env:QT_VERSION" "$hostArch" --outputdir "$env:RUNNER_TEMP/Qt"
          }
          $qtRoot = Join-Path $env:RUNNER_TEMP "Qt/$env:QT_VERSION"
          $targetQtConfig = Get-ChildItem -LiteralPath $qtRoot -Recurse -Filter Qt6Config.cmake |
            Where-Object { $_.FullName -match [regex]::Escape("${{ matrix.qt-arch }}") -or $_.FullName -match "msvc2022_arm64" } |
            Select-Object -First 1
          $qtConfig = if ($targetQtConfig) {
            $targetQtConfig
          } else {
            Get-ChildItem -LiteralPath $qtRoot -Recurse -Filter Qt6Config.cmake |
              Select-Object -First 1
          }
          if (-not $qtConfig) {
            Get-ChildItem -LiteralPath $qtRoot -Recurse -Depth 3 -Force | Format-List FullName
            throw "Qt config was not found under $qtRoot"
          }
          $qtPrefix = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $qtConfig.FullName)))
          "QT_PREFIX=$qtPrefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Join-Path $qtPrefix "bin") | Out-File -FilePath $env:GITHUB_PATH -Append
          if ($hostArch) {
            $hostQtConfig = Get-ChildItem -LiteralPath $qtRoot -Recurse -Filter Qt6Config.cmake |
              Where-Object { $_.FullName -match [regex]::Escape($hostArch) -or $_.FullName -match "msvc2022_64" } |
              Select-Object -First 1
            if (-not $hostQtConfig) {
              Get-ChildItem -LiteralPath $qtRoot -Recurse -Depth 3 -Force | Format-List FullName
              throw "Host Qt config was not found under $qtRoot"
            }
            $hostQtPrefix = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $hostQtConfig.FullName)))
            "QT_HOST_PREFIX=$hostQtPrefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qtHostPathArg = @()
          if ($env:QT_HOST_PREFIX) {
            $qtHostPathArg = @("-DQT_HOST_PATH=$env:QT_HOST_PREFIX")
          }
          cmake -S . -B "${{ matrix.build-dir }}" `
            -G "${{ matrix.cmake-generator }}" -A "${{ matrix.cmake-arch }}" `
            -DCMAKE_PREFIX_PATH="$env:QT_PREFIX" `
            -DHKM_QT_MAJOR=6 `
            -DHKM_DEPLOY_QT_RUNTIME=ON `
            -DHKM_APP_VERSION_OVERRIDE="$env:RELEASE_VERSION" `
            -DHKM_UPDATE_MANIFEST_URL="$env:UPDATE_MANIFEST_URL" `
            @qtHostPathArg

      - name: Configure Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B "${{ matrix.build-dir }}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DHKM_QT_MAJOR=6 \
            -DHKM_DEPLOY_QT_RUNTIME=OFF \
            -DHKM_APP_VERSION_OVERRIDE="$RELEASE_VERSION" \
            -DHKM_UPDATE_MANIFEST_URL="$UPDATE_MANIFEST_URL"

      - name: Build
        shell: pwsh
        run: cmake --build "${{ matrix.build-dir }}" --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir "${{ matrix.build-dir }}" -C Release --output-on-failure

      - name: Package Windows installer and portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:RELEASE_VERSION
          $arch = "${{ matrix.arch }}"
          $buildDir = "${{ matrix.build-dir }}"
          $artifactBase = "WStart-$version-windows-$arch"
          $packageRoot = Join-Path $env:RUNNER_TEMP $artifactBase
          $payload = Join-Path $packageRoot "payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item -Path (Join-Path $buildDir "Release\*") -Destination $payload -Recurse -Force

          $portablePath = Join-Path (Get-Location) "$artifactBase-portable.zip"
          New-Item -ItemType File -Force -Path (Join-Path $payload "WStart.portable") | Out-Null
          Compress-Archive -Path (Join-Path $payload "*") -DestinationPath $portablePath -Force
          Remove-Item -LiteralPath (Join-Path $payload "WStart.portable") -Force

          python -m aqt install-tool windows desktop tools_ifw --outputdir "$env:RUNNER_TEMP/QtTools"
          $binaryCreator = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/QtTools" -Recurse -Filter binarycreator.exe |
            Select-Object -First 1
          if (-not $binaryCreator) {
            Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/QtTools" -Recurse -Depth 4 -Force | Format-List FullName
            throw "binarycreator.exe was not found."
          }

          $ifwRoot = Join-Path $packageRoot "ifw"
          $ifwConfig = Join-Path $ifwRoot "config"
          $ifwPackage = Join-Path $ifwRoot "packages/com.wstart.hotkeymanager"
          $ifwData = Join-Path $ifwPackage "data"
          $ifwMeta = Join-Path $ifwPackage "meta"
          New-Item -ItemType Directory -Force -Path $ifwConfig, $ifwData, $ifwMeta | Out-Null
          Copy-Item -Path (Join-Path $payload "*") -Destination $ifwData -Recurse -Force
          Copy-Item -LiteralPath "resources/app.ico" -Destination (Join-Path $ifwConfig "app.ico") -Force

          $releaseDate = Get-Date -Format "yyyy-MM-dd"
          $config = Get-Content -Raw -LiteralPath "packaging/ifw/config/config.xml.in"
          $config = $config.Replace("@VERSION@", $version)
          Set-Content -LiteralPath (Join-Path $ifwConfig "config.xml") -Value $config -Encoding UTF8
          $package = Get-Content -Raw -LiteralPath "packaging/ifw/packages/com.wstart.hotkeymanager/meta/package.xml.in"
          $package = $package.Replace("@VERSION@", $version).Replace("@RELEASE_DATE@", $releaseDate)
          Set-Content -LiteralPath (Join-Path $ifwMeta "package.xml") -Value $package -Encoding UTF8
          Copy-Item -LiteralPath "packaging/ifw/packages/com.wstart.hotkeymanager/meta/installscript.qs" -Destination (Join-Path $ifwMeta "installscript.qs") -Force

          $installerPath = Join-Path (Get-Location) "$artifactBase-setup.exe"
          & $binaryCreator.FullName --offline-only -c (Join-Path $ifwConfig "config.xml") -p (Join-Path $ifwRoot "packages") $installerPath

          "PACKAGE_PATHS<<EOF" | Out-File -FilePath $env:GITHUB_ENV -Append
          $installerPath | Out-File -FilePath $env:GITHUB_ENV -Append
          $portablePath | Out-File -FilePath $env:GITHUB_ENV -Append
          "EOF" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package macOS dmg and portable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          arch="${{ matrix.arch }}"
          artifact_base="WStart-${version}-macos-${arch}"
          app_path="${{ matrix.build-dir }}/WStart.app"
          package_root="$RUNNER_TEMP/$artifact_base"
          dmg_stage="$RUNNER_TEMP/${artifact_base}-dmg"
          test -d "$app_path"
          "$QT_PREFIX/bin/macdeployqt" "$app_path" -verbose=2

          dmg_path="$PWD/${artifact_base}.dmg"
          portable_path="$PWD/${artifact_base}-portable.zip"
          rm -rf "$package_root" "$dmg_stage" "$dmg_path" "$portable_path"
          mkdir -p "$package_root" "$dmg_stage"
          cp -R "$app_path" "$package_root/"
          cp -R "$app_path" "$dmg_stage/"

          cleanup_dmg_resources() {
            hdiutil detach "/Volumes/WStart" -force >/dev/null 2>&1 || true
            hdiutil detach "/Volumes/WStart 1" -force >/dev/null 2>&1 || true
            pkill -x diskimages-helper >/dev/null 2>&1 || true
            sleep 2
          }

          create_dmg() {
            local attempt
            for attempt in 1 2 3; do
              rm -f "$dmg_path"
              cleanup_dmg_resources
              if hdiutil create -volname WStart -srcfolder "$dmg_stage" -ov -format UDZO "$dmg_path"; then
                return 0
              fi
              echo "::warning::hdiutil create failed on attempt ${attempt}; retrying after cleanup."
              hdiutil info || true
              sleep $((attempt * 5))
            done
            return 1
          }

          create_dmg
          touch "$package_root/WStart.portable"
          ditto -c -k --sequesterRsrc "$package_root" "$portable_path"
          {
            echo "PACKAGE_PATHS<<EOF"
            echo "$dmg_path"
            echo "$portable_path"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Package Linux deb and portable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          arch="${{ matrix.arch }}"
          deb_arch="${{ matrix.deb-arch }}"
          artifact_base="WStart-${version}-linux-${arch}"
          package_root="$RUNNER_TEMP/$artifact_base"
          install_root="$package_root/WStart"
          cmake --install "${{ matrix.build-dir }}" --prefix "$install_root"

          mkdir -p "$install_root/lib" "$install_root/plugins" "$install_root/bin"

          copy_qt_deps() {
            local target="$1"
            if [[ ! -f "$target" ]]; then
              return
            fi
            ldd "$target" | awk '{ if ($3 ~ /^\/.*\/Qt\/.*\.so/) print $3; }' | while read -r dep; do
              cp -L -n "$dep" "$install_root/lib/" || true
            done
          }

          for plugin_type in platforms imageformats iconengines styles tls networkinformation; do
            if [[ -d "$QT_PREFIX/plugins/$plugin_type" ]]; then
              mkdir -p "$install_root/plugins/$plugin_type"
              cp -R "$QT_PREFIX/plugins/$plugin_type/." "$install_root/plugins/$plugin_type/"
            fi
          done

          copy_qt_deps "$install_root/bin/WStart"
          for pass in 1 2 3; do
            while IFS= read -r -d '' file; do
              copy_qt_deps "$file"
            done < <(find "$install_root/plugins" "$install_root/lib" -type f \( -name "*.so" -o -name "*.so.*" \) -print0)
          done

          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf '%s\n' 'set -euo pipefail'
            printf '%s\n' 'APP_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"'
            printf '%s\n' 'export LD_LIBRARY_PATH="$APP_DIR/lib:${LD_LIBRARY_PATH:-}"'
            printf '%s\n' 'export QT_PLUGIN_PATH="$APP_DIR/plugins"'
            printf '%s\n' 'exec "$APP_DIR/bin/WStart" "$@"'
          } > "$install_root/wstart.sh"
          chmod +x "$install_root/wstart.sh"

          portable_path="$PWD/${artifact_base}-portable.tar.gz"
          touch "$install_root/WStart.portable"
          tar -C "$package_root" -czf "$portable_path" WStart
          rm -f "$install_root/WStart.portable"

          deb_root="$RUNNER_TEMP/${artifact_base}-deb"
          app_dir="$deb_root/opt/WStart"
          mkdir -p "$app_dir" "$deb_root/DEBIAN" "$deb_root/usr/share/applications" "$deb_root/usr/share/icons/hicolor/scalable/apps"
          cp -R "$install_root/." "$app_dir/"
          cp "$install_root/share/applications/wstart.desktop" "$deb_root/usr/share/applications/wstart.desktop"
          cp "$install_root/share/icons/hicolor/scalable/apps/wstart.svg" "$deb_root/usr/share/icons/hicolor/scalable/apps/wstart.svg"
          {
            printf '%s\n' 'Package: wstart'
            printf '%s\n' "Version: $version"
            printf '%s\n' 'Section: utils'
            printf '%s\n' 'Priority: optional'
            printf '%s\n' "Architecture: $deb_arch"
            printf '%s\n' 'Maintainer: WStart <noreply@example.com>'
            printf '%s\n' 'Description: Hotkey launcher and shortcut manager.'
          } > "$deb_root/DEBIAN/control"
          find "$deb_root" -type d -exec chmod 755 {} \;
          dpkg-deb --build --root-owner-group "$deb_root" "$PWD/${artifact_base}.deb"
          deb_path="$PWD/${artifact_base}.deb"
          {
            echo "PACKAGE_PATHS<<EOF"
            echo "$deb_path"
            echo "$portable_path"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: WStart-${{ env.RELEASE_VERSION }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.PACKAGE_PATHS }}
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: build-packages
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -la dist

      - name: Flatten release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "dist-release" | Out-Null
          Get-ChildItem -LiteralPath "dist" -Recurse -File |
            Where-Object { $_.Name -ne "update.json" } |
            Sort-Object FullName |
            ForEach-Object {
              $target = Join-Path "dist-release" $_.Name
              if (Test-Path -LiteralPath $target) {
                throw "Duplicate release asset name: $($_.Name)"
              }
              Copy-Item -LiteralPath $_.FullName -Destination $target -Force
            }
          Get-ChildItem -LiteralPath "dist-release" -File | Sort-Object Name | Format-Table Name,Length

      - name: Generate update manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $version = $tag
          if ($version.StartsWith("v")) {
            $version = $version.Substring(1)
          }
          $repo = "${{ github.repository }}"
          $assets = @()
          Get-ChildItem -LiteralPath dist-release -File | Sort-Object Name | ForEach-Object {
            $name = $_.Name
            $platform = $null
            $arch = $null
            $type = $null
            if ($name -match "windows-(x64|arm64)-setup\\.exe$") {
              $platform = "windows"; $arch = $matches[1]; $type = "installer"
            } elseif ($name -match "windows-(x64|arm64)-portable\\.zip$") {
              $platform = "windows"; $arch = $matches[1]; $type = "portable"
            } elseif ($name -match "macos-(x64|arm64)\\.dmg$") {
              $platform = "macos"; $arch = $matches[1]; $type = "installer"
            } elseif ($name -match "macos-(x64|arm64)-portable\\.zip$") {
              $platform = "macos"; $arch = $matches[1]; $type = "portable"
            } elseif ($name -match "linux-(x64|arm64)\\.deb$") {
              $platform = "linux"; $arch = $matches[1]; $type = "installer"
            } elseif ($name -match "linux-(x64|arm64)-portable\\.tar\\.gz$") {
              $platform = "linux"; $arch = $matches[1]; $type = "portable"
            }
            if ($platform) {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              $assets += [ordered]@{
                platform = $platform
                arch = $arch
                type = $type
                fileName = $name
                url = "https://github.com/$repo/releases/download/$tag/$name"
                apiUrl = ""
                sha256 = $hash
              }
            }
          }
          $manifest = [ordered]@{
            version = $version
            pageUrl = "https://github.com/$repo/releases/tag/$tag"
            releaseNotes = "WStart $version release."
            assets = $assets
          }
          if ($assets.Count -eq 0) {
            throw "No release package assets were found under dist-release."
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath "dist-release/update.json" -Encoding UTF8

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: WStart ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          files: dist-release/*

      - name: Refresh update manifest with asset API URLs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $release = gh api "repos/${{ github.repository }}/releases/tags/$tag" | ConvertFrom-Json
          $manifest = Get-Content -Raw -LiteralPath "dist-release/update.json" | ConvertFrom-Json
          foreach ($manifestAsset in $manifest.assets) {
            $releaseAsset = $release.assets | Where-Object { $_.name -eq $manifestAsset.fileName } | Select-Object -First 1
            if ($releaseAsset) {
              $manifestAsset.apiUrl = $releaseAsset.url
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath "update.json" -Encoding UTF8
          gh release upload "$tag" "update.json" --clobber --repo "${{ github.repository }}"

      - name: Mark versioned release as GitHub latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          function Get-VersionParts([string]$value) {
            $clean = $value.Trim()
            if ($clean.StartsWith("v", [System.StringComparison]::OrdinalIgnoreCase)) {
              $clean = $clean.Substring(1)
            }
            $parts = @()
            foreach ($token in $clean.Split(".")) {
              if ($token -match "^(\d+)") {
                $parts += [int]$matches[1]
              } else {
                $parts += 0
              }
            }
            return $parts
          }
          function Test-VersionGreaterThanOrEqual([string]$left, [string]$right) {
            $leftParts = @(Get-VersionParts $left)
            $rightParts = @(Get-VersionParts $right)
            $count = [Math]::Max($leftParts.Count, $rightParts.Count)
            for ($i = 0; $i -lt $count; $i++) {
              $l = if ($i -lt $leftParts.Count) { $leftParts[$i] } else { 0 }
              $r = if ($i -lt $rightParts.Count) { $rightParts[$i] } else { 0 }
              if ($l -ne $r) {
                return $l -gt $r
              }
            }
            return $true
          }
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $currentLatest = $null
          $PSNativeCommandUseErrorActionPreference = $false
          $latestJson = gh api "repos/${{ github.repository }}/releases/latest"
          if ($LASTEXITCODE -eq 0 -and $latestJson) {
            $currentLatest = ($latestJson | ConvertFrom-Json).tag_name
          }
          $PSNativeCommandUseErrorActionPreference = $true
          if ($currentLatest -and -not (Test-VersionGreaterThanOrEqual $tag $currentLatest)) {
            Write-Host "Current GitHub latest release $currentLatest is newer than $tag. Skip latest update."
            exit 0
          }
          $release = gh api "repos/${{ github.repository }}/releases/tags/$tag" | ConvertFrom-Json
          gh api `
            --method PATCH `
            "repos/${{ github.repository }}/releases/$($release.id)" `
            -f make_latest=true `
            -f name="WStart $tag"
