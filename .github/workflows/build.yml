name: Build WStart

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  QT_VERSION: 6.8.3
  UPDATE_MANIFEST_URL: https://api.github.com/repos/${{ github.repository }}/releases/latest

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows / Qt 6.8.3 / MSVC / x64
            os: windows-2022
            qt-host: windows
            qt-arch: win64_msvc2022_64
            build-dir: out/build/github-windows-qt6.8.3-msvc2022-dynamic-x64
          - name: macOS / Qt 6.8.3 / clang / x64
            os: macos-15-intel
            qt-host: mac
            qt-arch: clang_64
            build-dir: out/build/github-macos-qt6.8.3-clang-x64
          - name: Linux / Qt 6.8.3 / gcc / x64
            os: ubuntu-22.04
            qt-host: linux
            qt-arch: linux_gcc_64
            build-dir: out/build/github-linux-qt6.8.3-gcc-x64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0

      - name: Install macOS system packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt "${{ matrix.qt-host }}" desktop "$env:QT_VERSION" "${{ matrix.qt-arch }}" --outputdir "$env:RUNNER_TEMP/Qt"
          $qtRoot = Join-Path $env:RUNNER_TEMP "Qt/$env:QT_VERSION"
          $qtConfig = Get-ChildItem -LiteralPath $qtRoot -Recurse -Filter Qt6Config.cmake |
            Select-Object -First 1
          if (-not $qtConfig) {
            Get-ChildItem -LiteralPath $qtRoot -Recurse -Depth 3 -Force | Format-List FullName
            throw "Qt config was not found under $qtRoot"
          }
          $qtPrefix = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $qtConfig.FullName)))
          "QT_PREFIX=$qtPrefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Join-Path $qtPrefix "bin") | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B "${{ matrix.build-dir }}" `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_PREFIX" `
            -DHKM_QT_MAJOR=6 `
            -DHKM_DEPLOY_QT_RUNTIME=ON `
            -DHKM_UPDATE_MANIFEST_URL="$env:UPDATE_MANIFEST_URL"

      - name: Configure Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B "${{ matrix.build-dir }}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DHKM_QT_MAJOR=6 \
            -DHKM_DEPLOY_QT_RUNTIME=OFF \
            -DHKM_UPDATE_MANIFEST_URL="$UPDATE_MANIFEST_URL"

      - name: Build
        shell: pwsh
        run: cmake --build "${{ matrix.build-dir }}" --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir "${{ matrix.build-dir }}" -C Release --output-on-failure

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifactName = "WStart-qt6.8.3-msvc2022-dynamic-x64"
          $packageRoot = Join-Path $env:RUNNER_TEMP $artifactName
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item -Path (Join-Path "${{ matrix.build-dir }}" "Release\*") -Destination $packageRoot -Recurse -Force
          Compress-Archive -Path (Join-Path $packageRoot "*") -DestinationPath "$artifactName.zip" -Force
          "ARTIFACT_NAME=$artifactName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error
          retention-days: 14
