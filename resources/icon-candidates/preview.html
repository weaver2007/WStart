<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HSTART icon candidates</title>
  <style>
    body {
      margin: 32px;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }
    h1 {
      margin: 0 0 24px;
      font-size: 22px;
      font-weight: 700;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 220px);
      gap: 24px;
    }
    .card {
      background: #fff;
      border: 1px solid #d7e0ea;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
    }
    .card img {
      display: block;
      width: 128px;
      height: 128px;
      margin: 0 auto 14px;
    }
    .name {
      font-size: 14px;
      font-weight: 650;
      text-align: center;
    }
    .small {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
      align-items: center;
    }
    .small img {
      margin: 0;
      width: 32px;
      height: 32px;
    }
    .small img.medium {
      width: 48px;
      height: 48px;
    }
  </style>
</head>
<body>
  <h1>HSTART icon candidates</h1>
  <div class="grid">
    <div class="card">
      <img src="01-keyboard-bolt.svg" alt="Keyboard Bolt">
      <div class="name">01 Keyboard Bolt</div>
      <div class="small"><img src="01-keyboard-bolt.svg" alt=""><img class="medium" src="01-keyboard-bolt.svg" alt=""></div>
    </div>
    <div class="card">
      <img src="02-global-hotkey-ring.svg" alt="Global Hotkey Ring">
      <div class="name">02 Global Hotkey Ring</div>
      <div class="small"><img src="02-global-hotkey-ring.svg" alt=""><img class="medium" src="02-global-hotkey-ring.svg" alt=""></div>
    </div>
    <div class="card">
      <img src="03-shortcut-launch.svg" alt="Shortcut Launch">
      <div class="name">03 Shortcut Launch</div>
      <div class="small"><img src="03-shortcut-launch.svg" alt=""><img class="medium" src="03-shortcut-launch.svg" alt=""></div>
    </div>
    <div class="card">
      <img src="04-command-hub.svg" alt="Command Hub">
      <div class="name">04 Command Hub</div>
      <div class="small"><img src="04-command-hub.svg" alt=""><img class="medium" src="04-command-hub.svg" alt=""></div>
    </div>
    <div class="card">
      <img src="05-priority-hotkey-shield.svg" alt="Priority Hotkey Shield">
      <div class="name">05 Priority Hotkey Shield</div>
      <div class="small"><img src="05-priority-hotkey-shield.svg" alt=""><img class="medium" src="05-priority-hotkey-shield.svg" alt=""></div>
    </div>
    <div class="card">
      <img src="06-window-shortcut.svg" alt="Window Shortcut">
      <div class="name">06 Window Shortcut</div>
      <div class="small"><img src="06-window-shortcut.svg" alt=""><img class="medium" src="06-window-shortcut.svg" alt=""></div>
    </div>
  </div>
</body>
</html>
